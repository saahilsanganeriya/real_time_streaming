# =====================================
# ROOT LOGGER CONFIGURATION
# =====================================
# Global logging level for all unspecified loggers
# DEBUG level provides comprehensive visibility for troubleshooting
rootLogger.level = DEBUG
rootLogger.appenderRef.console.ref = ConsoleAppender

# =====================================
# APPLICATION-SPECIFIC LOGGING
# =====================================
# Enhanced logging for shift opportunity processing application
# DEBUG level captures detailed event processing, transformations, and business logic
# additivity=false prevents duplicate logging through root logger
logger.application.name = com.amazon.shift.opportunity
logger.application.level = DEBUG
logger.application.appenderRef.console.ref = ConsoleAppender
logger.application.additivity = false

# =====================================
# INFRASTRUCTURE COMPONENT LOGGING
# =====================================
# OpenSearch connector logging for sink operations and error handling
# INFO level reduces noise while capturing important operational information
logger.opensearch.name = org.apache.flink.connector.opensearch
logger.opensearch.level = INFO
logger.opensearch.appenderRef.console.ref = ConsoleAppender
logger.opensearch.additivity = false

# Kinesis connector logging for source operations and throughput monitoring
# INFO level provides visibility into stream consumption without excessive detail
logger.kinesis.name = org.apache.flink.connector.kinesis
logger.kinesis.level = INFO
logger.kinesis.appenderRef.console.ref = ConsoleAppender
logger.kinesis.additivity = false

# =====================================
# CONSOLE APPENDER CONFIGURATION
# =====================================
# Console output configuration optimized for CloudWatch Logs integration
# Pattern layout provides structured information for monitoring and debugging
# Format: [timestamp] [level] [logger] [thread] - [message]
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
# Optimized pattern for CloudWatch parsing and correlation:
# - HH:mm:ss,SSS: Precise timestamp for event correlation
# - %-5p: Left-aligned log level (DEBUG, INFO, WARN, ERROR)
# - %-60c: Left-aligned logger name (truncated for readability)
# - %x: NDC (Nested Diagnostic Context) for request tracing
# - %m%n: Message with newline
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %-60c %x - %m%n

