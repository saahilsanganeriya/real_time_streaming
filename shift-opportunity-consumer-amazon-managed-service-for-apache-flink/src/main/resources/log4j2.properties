# Description:
# This configuration file defines logging behavior for the Flink streaming application
# in both local development and production Amazon MSF environments. It provides
# structured logging with appropriate levels for debugging, monitoring, and troubleshooting.
# 
# Key Features:
# - Application-specific logging for detailed debugging
# - Connector-specific logging for infrastructure monitoring
# - Console output optimized for CloudWatch Logs integration
# - Performance-optimized pattern layout for high-throughput processing
# - Non-additive loggers to prevent log duplication
# 
# Logging Strategy:
# - DEBUG level for application code to capture detailed event processing
# - INFO level for infrastructure components to reduce noise
# - Structured format for easy parsing and analysis
# - Time-based format for correlation with external systems
# 
# CloudWatch Integration:
# In Amazon MSF, console output is automatically forwarded to CloudWatch Logs
# for centralized monitoring, alerting, and analysis. The pattern layout is
# optimized for CloudWatch parsing and searching capabilities.
# 
# Performance Considerations:
# - Minimal string concatenation in pattern layout
# - Efficient timestamp formatting for high-frequency logging
# - Non-additive loggers prevent duplicate log entries
# - Optimized for high-throughput streaming scenarios
